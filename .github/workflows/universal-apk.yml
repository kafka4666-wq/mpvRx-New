name: Build mpvRx universal APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universal-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build standard universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build stable standard release APKs
        run: ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2
      - name: Stage universal APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(app/build/outputs/apk/standard/release/*universal*release*.apk)
          if [[ ${#candidates[@]} -ne 1 ]]; then
            echo "Expected one universal APK; found ${#candidates[@]}"
            find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "${candidates[0]}" dist/mpvRx-standard-universal-unsigned.apk
          sha256sum dist/mpvRx-standard-universal-unsigned.apk > dist/SHA256SUMS.txt
      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-standard-universal-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
